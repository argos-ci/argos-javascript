packages:
  - packages/*

catalog:
  '@types/node': ^22.20.5
  vitest: ^5.1.0

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  chromedriver: true
  cypress: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  nx: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  axios: ^1.16.0
  esbuild: ^0.25.10
  form-data: ^4.0.6
  follow-redirects: ^1.16.1
  serialize-javascript: ^7.0.3
  source-map-js: ^1.2.2
  tar: ^7.5.16
  tmp: ^0.2.7
  # TypeScript 7 has no JS API yet, so every `typescript` import gets the 6.0
  # wrapper, like the root's own dependency. Without this, optional peers in
  # packages resolve to plain typescript@6, whose `tsc` pnpm can link into a
  # package and shadow the root's TypeScript 7 one.
  typescript: npm:@typescript/typescript6@^6.0.2
  undici: ^8.12.2
  vite: ^7.3.7
  # Jest 30.5 throws on `module.register()`, which Storybook calls to load
  # `.storybook/test-runner.ts`, so every test-runner suite fails at setup.
  # Jest 30.4 packages pin each other exactly, so this holds the whole tree.
  # Drop once https://github.com/storybookjs/storybook/issues/36116 is fixed.
  '@storybook/test-runner>jest': 30.4.2
  '@storybook/test-runner>jest-circus': 30.4.2
  '@storybook/test-runner>jest-runner': 30.4.2
  '@storybook/test-runner>jest-environment-node': 30.4.1

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@argos-ci/*"

patchedDependencies:
  # Provenance publishing (lerna -> libnpmpublish -> sigstore). When a Rekor
  # write commits but the 5s client timeout fires first, sigstore retries and
  # Rekor answers 409 "an equivalent entry already exists". sigstore hardcodes
  # `fetchOnConflict: false`, so that 409 kills the publish mid-release. The
  # patch turns it on: on a 409, fetch the entry we already wrote and carry on.
  # https://github.com/sigstore/sigstore-js/issues/1708 made `true` the default
  # in @sigstore/sign 5.1.0, but sigstore 5.0.1 still passes `false` explicitly.
  # Drop once a sigstore release stops overriding that default.
  sigstore@5.0.1: patches/sigstore@5.0.1.patch
