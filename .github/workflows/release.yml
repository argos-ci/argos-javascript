name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - canary
      debug:
        description: "Verbose publish logs (needed to see Sigstore HTTP status codes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  release:
    # A release normally takes ~2 minutes; this just caps a hung publish.
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup deps
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish
        run: |
          # Lerna reports a failed publish as just the Sigstore error code and
          # logs the underlying HTTP response at `silly` only, so a Fulcio or
          # Rekor failure is undiagnosable without this.
          if [ "${{ inputs.debug }}" = "true" ]; then
            set -- --loglevel silly
          fi

          if [ "${{ github.event.inputs.release_type }}" = "canary" ]; then
            npm run release-canary -- --yes "$@"
          else
            npm run release -- --yes "$@"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Do not add NPM_CONFIG_TIMEOUT here. Lerna spreads its raw npm-config
          # snapshot into the publish options and does not coerce `timeout` to a
          # number, so the env var arrives as a string, reaches
          # `http.ClientRequest`, and every publish dies on
          # `ERR_INVALID_ARG_TYPE`. Sigstore's 5s default stands instead.
