name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - canary

permissions:
  contents: write
  id-token: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  release:
    # Publish gives each HTTP call five minutes and retries twice, so a hung
    # Sigstore or registry could otherwise stall the job for hours.
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup deps
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "canary" ]; then
            npm run release-canary -- --yes
          else
            npm run release -- --yes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Budget for a single HTTP call during publish, Sigstore's included.
          # Lerna passes no timeout, so Sigstore falls back to 5s and abandons
          # slow Rekor writes; the retry then hits a 409 and fails the publish.
          # 300000 is npm's own `fetch-timeout` default.
          NPM_CONFIG_TIMEOUT: "300000"
