name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - canary
          - from-package

permissions:
  contents: write
  id-token: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup deps
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # No npm token step: auth is npm Trusted Publishing. lerna exchanges this job's OIDC id-token
      # (id-token: write above) for a short-lived npm token per package, so no secret can expire.
      # Each package needs a trusted publisher on npmjs.com (DevinoSolutions/snapvisor-js,
      # release.yml), and npm accepts the exchange only from GitHub-hosted runners. --loglevel
      # verbose prints npm's reason when the exchange is refused instead of a bare E404/ENEEDAUTH.
      - name: Publish
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "canary" ]; then
            NPM_CONFIG_PROVENANCE=true npm run release-canary -- --yes --loglevel verbose
          elif [ "${{ github.event.inputs.release_type }}" = "from-package" ]; then
            npm run build
            NPM_CONFIG_PROVENANCE=true npx lerna publish from-package --yes --loglevel verbose
          else
            NPM_CONFIG_PROVENANCE=true npm run release -- --yes --loglevel verbose
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
